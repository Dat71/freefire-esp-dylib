name: Build iOS Dylib
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile dylib
        run: |
          clang -arch arm64 -dynamiclib \
            -framework UIKit \
            -framework Foundation \
            -mios-version-min=13.0 \
            -O2 \
            -o ff_esp.dylib \
            ff_esp.m
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ff_esp
          path: ff_esp.dylib
