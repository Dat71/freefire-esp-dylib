name: Build BattleCats Ultimate Menu

# Tự động chạy khi bạn tải code mới lên hoặc bấm nút chạy bằng tay
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest # Sử dụng máy chủ macOS của GitHub

    steps:
    - name: Tải mã nguồn về máy ảo
      uses: actions/checkout@v4

    - name: Thiết lập môi trường iOS SDK
      run: |
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcrun --sdk iphoneos --show-sdk-path

    - name: Biên dịch file .m sang .dylib
      run: |
        xcrun -sdk iphoneos clang -dynamiclib -arch arm64 \
        -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
        -miphoneos-version-min=14.0 \
        -framework UIKit \
        -framework Foundation \
        -framework QuartzCore \
        -framework CoreGraphics \
        BattleCats_UltimateMenu.m -o BattleCats_UltimateMenu.dylib

    - name: Xuất file thành phẩm (Artifact) để tải về
      uses: actions/upload-artifact@v4
      with:
        name: BattleCats-UltimateMenu-Dylib
        path: BattleCats_UltimateMenu.dylib
